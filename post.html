<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>المقال | مدونة الأخبار اليومية</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col">
<div id="site-header"></div>
<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full"><article id="post-view" class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden"></article></main>
<div id="site-footer"></div><div id="cookie-consent"></div>
<script type="module">
import {supabase,backendReady,normalizePost} from './assets/js/backend.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
const postUrl=p=>'post.html?slug='+encodeURIComponent(p.slug);
function shell(){
 document.getElementById('site-header').innerHTML='<header class="bg-white dark:bg-gray-900 shadow-sm border-b border-gray-200 dark:border-gray-800"><div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"><a href="index.html" class="font-black text-xl">مدونة الأخبار</a><a href="index.html" class="text-xs text-brand-600">العودة للرئيسية</a></div></header>';
 document.getElementById('site-footer').innerHTML='<footer class="bg-gray-900 text-gray-300 mt-10 text-center text-xs py-6">© '+new Date().getFullYear()+' مدونة الأخبار اليومية. جميع الحقوق محفوظة.</footer>';
}
async function load(){
 shell();let p=null;
 if(backendReady){try{const r=await supabase.from('posts').select('*').eq('slug',slug).eq('status','published').maybeSingle();if(r.error)throw r.error;if(r.data)p=normalizePost(r.data)}catch(e){console.warn('Supabase unavailable; using static post data.',e)}}
 if(!p){const r=await fetch('data/posts.json',{cache:'no-store'});if(!r.ok)throw new Error('posts');const all=await r.json();p=all.find(x=>x.slug===slug)}
 if(!p){document.getElementById('post-view').innerHTML='<div class="p-10 text-center"><h1 class="text-xl font-black">المقال غير موجود</h1><a class="text-brand-600 text-sm" href="index.html">العودة</a></div>';return}
 document.title=esc(p.seoTitle||p.title)+' | مدونة الأخبار اليومية';
 document.querySelector('meta[name="description"]')?.setAttribute('content',p.seoDescription||p.excerpt||'');
 document.getElementById('post-view').innerHTML='<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'" class="w-full max-h-[520px] object-cover"><div class="p-6 sm:p-10"><span class="bg-brand-600 text-white text-xs font-bold px-3 py-1 rounded">'+esc(p.category)+'</span><h1 class="text-2xl sm:text-4xl font-black mt-4 leading-tight">'+esc(p.title)+'</h1><div class="text-xs text-gray-500 mt-3">'+esc(p.author)+' · '+esc(p.date)+'</div><div class="mt-8 text-sm leading-8 whitespace-pre-line">'+esc(p.content)+'</div></div>';
}
load();
</script>
<script src="assets/js/cookies.js" defer></script>
</body>
</html>
